<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notepad</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif;
         background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column;
         overflow: hidden; }
  #tabbar { display: flex; align-items: center; background: #252526;
            border-bottom: 1px solid #3c3c3c; min-height: 38px; padding: 0 8px;
            gap: 4px; overflow-x: auto; flex-shrink: 0; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
         background: transparent; border: none; border-radius: 6px 6px 0 0;
         color: #969696; font-size: 13px; cursor: pointer; white-space: nowrap;
         max-width: 200px; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; }
  .tab.active { background: #1e1e1e; color: #fff; }
  .tab .x { opacity: 0; border: none; background: none; color: inherit;
            font-size: 14px; cursor: pointer; padding: 0 4px; border-radius: 4px; }
  .tab:hover .x, .tab.active .x { opacity: 0.7; }
  .tab .x:hover { opacity: 1; background: #3c3c3c; }
  #newtab { border: none; background: none; color: #969696; font-size: 18px;
            cursor: pointer; padding: 4px 10px; border-radius: 6px; }
  #newtab:hover { background: #2d2d2d; color: #fff; }
  #editor { flex: 1; border: none; outline: none; resize: none;
            background: #1e1e1e; color: #d4d4d4; padding: 16px 20px;
            font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 14px;
            line-height: 1.6; }
  #statusbar { flex-shrink: 0; display: flex; justify-content: space-between;
               padding: 5px 14px; font-size: 12px; color: #969696;
               background: #252526; border-top: 1px solid #3c3c3c; }
</style>
</head>
<body>
<div id="tabbar"><button id="newtab" title="New note">+</button></div>
<textarea id="editor" spellcheck="false" placeholder="Start typing…"></textarea>
<div id="statusbar"><span id="savestate">Saved</span><span id="count"></span></div>
<script>
// Notepad — plain text, auto-saved to localStorage.
// No server, no backend. Everything lives in the browser's localStorage,
// which survives restarts. Just like Windows Notepad's unsaved-tab restore.
const $ = id => document.getElementById(id);
const LS_NOTES = 'notepad.notes';   // {id: {title, content, updated}}
const LS_STATE = 'notepad.state';   // {open: [ids], active: id}

function loadNotes() {
  try { return JSON.parse(localStorage.getItem(LS_NOTES) || '{}'); }
  catch(e) { return {}; }
}
function saveNotes(notes) {
  localStorage.setItem(LS_NOTES, JSON.stringify(notes));
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_STATE) || '{}');
    if (Array.isArray(s.open)) return s;
  } catch(e) {}
  return {open: [], active: null};
}
function saveState(open, active) {
  localStorage.setItem(LS_STATE, JSON.stringify({open, active}));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function titleFor(content) {
  const line = (content || '').split('\n')[0].trim().slice(0, 40);
  return line || 'Untitled';
}

let notes = loadNotes();
let openTabs = [];
let activeId = null;

function init() {
  const s = loadState();
  // Drop ids for notes that no longer exist.
  openTabs = (s.open || []).filter(id => notes[id]);
  activeId = notes[s.active] ? s.active : null;
  if (!openTabs.length) {
    const id = uid();
    notes[id] = {title: 'Untitled', content: '', updated: Date.now()};
    saveNotes(notes);
    openTabs = [id];
  }
  if (!activeId || !notes[activeId]) activeId = openTabs[0];
  persistState();
  renderTabs();
  openNote(activeId, false);
}

function persistState() {
  saveState(openTabs, activeId);
}

function renderTabs() {
  const bar = $('tabbar');
  bar.querySelectorAll('.tab').forEach(el => el.remove());
  const plus = $('newtab');
  for (const id of openTabs) {
    const n = notes[id];
    if (!n) continue;
    const el = document.createElement('div');
    el.className = 'tab' + (id === activeId ? ' active' : '');
    el.innerHTML = '<span class="t"></span><button class="x" title="Close">×</button>';
    el.querySelector('.t').textContent = n.title || 'Untitled';
    el.querySelector('.t').onclick = () => { if (id !== activeId) openNote(id); };
    el.querySelector('.x').onclick = (e) => { e.stopPropagation(); closeTab(id); };
    bar.insertBefore(el, plus);
  }
}

function openNote(id, focus=true) {
  const n = notes[id];
  if (!n) return;
  activeId = id;
  $('editor').value = n.content || '';
  persistState();
  renderTabs();
  updateCount();
  $('savestate').textContent = 'Saved';
  if (focus) $('editor').focus();
}

function newNote() {
  const id = uid();
  notes[id] = {title: 'Untitled', content: '', updated: Date.now()};
  saveNotes(notes);
  openTabs.push(id);
  persistState();
  renderTabs();
  openNote(id);
}

function closeTab(id) {
  const idx = openTabs.indexOf(id);
  if (idx < 0) return;
  const n = notes[id];
  // Empty notes are deleted; notes with content are kept (can be reopened
  // — but for simplicity, closing just removes the tab; the note stays
  // in storage and will be restored if it was the only tab).
  // Actually: keep it simple — closing a tab keeps the note. To delete,
  // clear the content and close.
  openTabs.splice(idx, 1);
  if (!(n.content || '').trim()) {
    delete notes[id];
    saveNotes(notes);
  }
  if (!openTabs.length) {
    const nid = uid();
    notes[nid] = {title: 'Untitled', content: '', updated: Date.now()};
    saveNotes(notes);
    openTabs = [nid];
  }
  if (activeId === id) activeId = openTabs[Math.min(idx, openTabs.length - 1)];
  persistState();
  renderTabs();
  openNote(activeId, false);
}

function updateCount() {
  const v = $('editor').value;
  const words = v.trim() ? v.trim().split(/\s+/).length : 0;
  $('count').textContent = v.length + ' chars · ' + words + ' words';
}

let saveTimer = null;
$('editor').addEventListener('input', () => {
  $('savestate').textContent = 'Saving…';
  updateCount();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const n = notes[activeId];
    if (!n) return;
    n.content = $('editor').value;
    n.title = titleFor(n.content);
    n.updated = Date.now();
    saveNotes(notes);
    persistState();
    renderTabs();
    $('savestate').textContent = 'Saved';
  }, 300);
});

$('newtab').onclick = newNote;

// localStorage persists automatically — nothing to flush on unload.
init();
</script>
</body>
</html>
